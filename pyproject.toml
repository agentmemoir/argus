[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus"
version = "0.1.0"
description = "An unattended phase driver: select work, reserve it on a shared board, launch it, watch it, and publish it."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Agent Memoir Developers", email = "dev@agentmemoir.com" }]
keywords = ["pipeline", "coding-agent", "automation", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = true

[project.scripts]
argus = "argus.cli:main"

[project.urls]
Homepage = "https://github.com/agentmemoir/argus"
Source = "https://github.com/agentmemoir/argus"

# The command is a shell driver, so the wheel ships the whole `src/argus`
# folder: the Python tools and the shell driver that sources the helpers beside
# it. Hatchling writes it to the distribution path `argus/`, and the default
# VCS rules keep caches and local files out.
[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
