name: verify

# The full checks run here, off every developer machine. Local runs stay
# scoped: `make guard-faults --only NAME` or one self-test case.
#
# Branch pushes run through pull_request; a branch with no pull request runs
# nothing until one opens. Listing both events would run every commit twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Lint and check formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

  self-test:
    name: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Run make self-test
        run: |
          started=$(date +%s)
          make self-test
          echo "self-test elapsed seconds: $(( $(date +%s) - started ))"

  guard-faults:
    name: guard-faults
    runs-on: ubuntu-latest
    # A cap for the current harness, which reruns a full driver self-test per
    # fault; tighten it after the scoped runs are measured on this runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Run make guard-faults
        run: |
          started=$(date +%s)
          make guard-faults
          echo "guard-faults elapsed seconds: $(( $(date +%s) - started ))"
