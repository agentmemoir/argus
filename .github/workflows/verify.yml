name: verify

# The full checks run here, off every developer machine. Local runs stay
# scoped: `uv run python tests/guard_faults.py --only NAME` or one self-test case.
#
# Branch pushes run through pull_request; a branch with no pull request runs
# nothing until one opens. Listing both events would run every commit twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Lint and check formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: make typecheck
      - name: Type-check (strict)
        run: make typecheck-strict
      - name: Check the line limit
        run: make lines
      - name: Check one-paragraph-per-line prose
        run: make prose
      - name: Check changelog fragments
        run: make changelog-check

  affected-checks:
    name: affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Temporary-storage rule and the whole suite
        run: |
          uv run pytest -q -n auto --dist loadfile tests/
          uv run python -m argus.board.reservations self-test
          uv run python -m argus.select.group --self-test
          uv run python -m argus.gitsync.main --self-test
          uv run python -m argus.issues.selftest

  self-test:
    name: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Check the example configuration
        run: make example-check
      - name: Check the installed package
        run: make install-check
      - name: Run make self-test
        run: |
          started=$(date +%s)
          make self-test
          echo "self-test elapsed seconds: $(( $(date +%s) - started ))"

  guard-faults:
    name: guard-faults
    runs-on: ubuntu-latest
    # A cap for the current harness, which reruns a full driver self-test per
    # fault; tighten it after the scoped runs are measured on this runner.
    timeout-minutes: 90
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Run make guard-faults
        run: |
          started=$(date +%s)
          make guard-faults
          echo "guard-faults elapsed seconds: $(( $(date +%s) - started ))"
