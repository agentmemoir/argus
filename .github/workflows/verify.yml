name: verify

# The full checks run here, off every developer machine. Local runs stay
# scoped: `uv run python tests/guard_faults.py --only NAME` or one self-test case.
#
# Branch pushes run through pull_request; a branch with no pull request runs
# nothing until one opens. Listing both events would run every commit twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Lint and check formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: make typecheck
      - name: Type-check (strict)
        run: make typecheck-strict
      - name: Check the line limit
        run: make lines
      - name: Check one-paragraph-per-line prose
        run: make prose
      - name: Check changelog fragments
        run: make changelog-check
      - name: Check the temporary-storage rule
        run: make noexecscan

  affected-checks:
    name: affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Temporary-storage rule and the whole suite
        run: |
          make noexecscan
          uv run pytest -q -n auto --dist loadfile tests/
          uv run python -m argus.board.reservations self-test
          uv run python -m argus.select.group --self-test
          uv run python -m argus.gitsync.main --self-test
          uv run python -m argus.issues.selftest

  # The quick tier, split into shards. The plan job reads the change and deals the
  # selected cases and faults into shards. A change the map cannot place selects the
  # whole area, and that set is split the same way. Each shard runs on its own runner,
  # so the gate's wall time is its longest shard. See tests/selftest_tiers.py.
  plan:
    name: plan the quick tier
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      driver: ${{ steps.plan.outputs.driver }}
      guard: ${{ steps.plan.outputs.guard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Plan the shards
        id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "driver=$(python3 tests/selftest_tiers.py driver --base "origin/${BASE_REF}" --matrix)"
            echo "guard=$(python3 tests/selftest_tiers.py guard --base "origin/${BASE_REF}" --matrix)"
          } >> "$GITHUB_OUTPUT"

  self-test-shard:
    name: self-test shard ${{ matrix.id }}
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.driver) }}
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Run the shard
        env:
          NAMES: ${{ matrix.names }}
        run: |
          started=$(date +%s)
          uv run python tests/selftest_tiers.py driver --cases "$NAMES" --shard "${{ matrix.id }}"
          echo "self-test shard ${{ matrix.id }} wall seconds: $(( $(date +%s) - started ))"

  self-test-static:
    name: self-test static checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Run the leak scan
        run: make leakscan
      - name: Check the example configuration
        run: make example-check
      - name: Check the installed package
        run: make install-check

  # The verdict for the self-test check. It runs no tests: it passes only when the
  # plan and every shard passed.
  self-test:
    name: self-test
    needs: [plan, self-test-shard, self-test-static]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard and static check to pass
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.self-test-shard.result }}
          STATIC: ${{ needs.self-test-static.result }}
        run: |
          echo "plan $PLAN, shards $SHARDS, static checks $STATIC"
          if [ "$PLAN" != success ] || [ "$SHARDS" != success ] || [ "$STATIC" != success ]; then
            echo "::error::quick self-test did not pass"
            exit 1
          fi

  guard-faults-shard:
    name: guard-faults shard ${{ matrix.id }}
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.guard) }}
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install the project
        run: uv sync --frozen
      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Run the shard
        env:
          NAMES: ${{ matrix.names }}
        run: |
          started=$(date +%s)
          CI=true uv run python tests/selftest_tiers.py guard --cases "$NAMES" --shard "${{ matrix.id }}"
          echo "guard-faults shard ${{ matrix.id }} wall seconds: $(( $(date +%s) - started ))"

  guard-faults:
    name: guard-faults
    needs: [plan, guard-faults-shard]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.guard-faults-shard.result }}
        run: |
          echo "plan $PLAN, shards $SHARDS"
          if [ "$PLAN" != success ] || [ "$SHARDS" != success ]; then
            echo "::error::quick guard-faults did not pass"
            exit 1
          fi
